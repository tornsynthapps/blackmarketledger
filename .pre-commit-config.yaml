repos:
    - repo: local
      hooks:
          - id: tests
            name: Run Tests
            entry: npm test
            language: system
            pass_filenames: false
            types: [javascript, jsx, ts, tsx]
          - id: lint
            name: Run Lint
            entry: npm run lint
            language: system
            pass_filenames: false
            types: [javascript, jsx, ts, tsx]
          - id: prettier
            name: Format Code
            entry: npx prettier --write
            language: system
            pass_filenames: true
            types: [javascript, jsx, ts, tsx]
